##############################################################################
# Playwright CI — Optimized for speed without sacrificing reliability
#
# Pipeline strategy:
#   Stage 1 (fast feedback): Smoke + Critical tests on Chromium only   [ACTIVE]
#   Stage 2 (full regression): All tests on Chromium, sharded          [DISABLED]
#   Stage 3 (cross-browser): Smoke tests on Firefox + WebKit           [DISABLED]
#   Stage 4: Merge Allure results and publish the report               [DISABLED]
#
# NOTE: This is a fresh template repo with no real tests yet. Only the smoke
# gate (Stage 1) is enabled. Stages 2–4 are commented out below because they
# can't do anything useful until you have:
#   • a real test suite (the shipped template-*.spec.ts files are excluded),
#   • the repository secrets listed below configured, and
#   • (for Stage 4) GitHub Pages enabled + a gh-pages branch.
# Uncomment each stage once its prerequisites are in place.
#
# Env var reference:
#   CI=true            — enables strict mode (forbidOnly, reduced retries)
#   PARALLEL_WORKERS   — Playwright worker count (set to runner vCPU count)
#   CROSS_BROWSER      — activates Firefox + WebKit projects
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   BASE_URL, API_BASE_URL, USER_EMAIL, USER_PASSWORD, USER_USERNAME
##############################################################################

name: Playwright Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      grep:
        description: "Tag filter (e.g. @smoke, @regression)"
        required: false
        default: ""
      workers:
        description: "Number of parallel workers"
        required: false
        default: "8"

concurrency:
  # Cancel in-progress runs for the same ref to avoid wasting runner minutes
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Stage 1: Fast smoke + critical gate — runs on every push/PR
  # ─────────────────────────────────────────────────────────────────────────
  smoke:
    name: "Smoke & Critical (Chromium)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        run: bunx playwright install chromium --with-deps

      - name: Run smoke & critical tests
        env:
          CI: "true"
          PARALLEL_WORKERS: ${{ github.event.inputs.workers || '8' }}
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          USER_USERNAME: ${{ secrets.USER_USERNAME }}
          RETRY_COUNT: "2"
        run: |
          GREP="${{ github.event.inputs.grep }}"
          WORKERS="${{ github.event.inputs.workers || '8' }}"
          # --pass-with-no-tests keeps the gate green while this template repo has
          # no real tests yet (template-*.spec.ts are excluded). Remove it once a
          # @smoke/@critical-tagged test exists if you want an empty match to fail.
          if [ -n "$GREP" ]; then
            bunx playwright test --project=chromium --grep "$GREP" --workers=$WORKERS --pass-with-no-tests
          else
            bunx playwright test --project=chromium --grep "@smoke|@critical" --workers=$WORKERS --pass-with-no-tests
          fi

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: test-results/
          retention-days: 7

